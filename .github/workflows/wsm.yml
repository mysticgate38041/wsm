name: WSM CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wsm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native-tests:
    name: Native runtime, binding, patch and relocation tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Compile and execute host units
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src/wsm-v2/build/host-tests
          for unit in runtime patch binding reloc; do
            clang++ -std=c++17 -O2 -Wall -Wextra -Werror -fno-exceptions -fno-rtti -pthread \
              '-DWSM_TEST_TMPDIR="/tmp"' "src/wsm-v2/tests/${unit}_test.cpp" \
              -o "src/wsm-v2/build/host-tests/${unit}"
            "src/wsm-v2/build/host-tests/${unit}"
          done

  android-build:
    name: Dual ABI Android build, catalog, Java and package tests
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Android toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { throw 'Runner Android SDK unavailable' }
          $manager = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $manager '--install' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018'
          if ($LASTEXITCODE) { throw 'Android SDK installation failed' }
      - name: Validate catalog and rejection gates
        shell: pwsh
        run: |
          python -B -X utf8 -m unittest discover -s src/wsm-v2/tests -p test_catalog.py -v
          if ($LASTEXITCODE) { throw 'Catalog tests failed' }
          python -B -X utf8 src/wsm-v2/scripts/build_feature_catalog.py --snapshot
          if ($LASTEXITCODE) { throw 'Catalog generation failed' }
          git diff --exit-code -- src/wsm-v2/features/feature_catalog.json src/wsm-v2/menu/FeatureCatalog.java src/wsm-v2/jni/wsm_feature_catalog.h
          if ($LASTEXITCODE) { throw 'Generated catalog differs from committed inputs' }
      - name: Build and verify module
        shell: pwsh
        run: |
          & ./src/wsm-v2/scripts/build.ps1 -Ndk "$env:ANDROID_HOME/ndk/27.2.12479018" -Jdk $env:JAVA_HOME -Sdk $env:ANDROID_HOME -Python (Get-Command python).Source -Jobs 2 -CatalogSnapshot
      - name: Record CI build provenance
        shell: pwsh
        run: |
          $receipt = Get-Content -Raw src/wsm-v2/build/build-receipt.json | ConvertFrom-Json -AsHashtable
          $record = @{ commit=$env:GITHUB_SHA; ref=$env:GITHUB_REF; runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT; qualification='INCOMPLETE_47_FEATURE_SCOPE'; dumpReaudited=$false; gameRuntimeExecuted=$false; ndk='27.2.12479018'; java=17; receipt=$receipt }
          $record | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 src/wsm-v2/dist/ci-build-provenance.json
          @('## WSM RC2 build verified', '', '- Five ELF binaries, Java state tests, DEX and sixteen package tests passed.', '- Nine catalog snapshot tests passed; original dump was not re-audited on CI.', '- Gameplay and device installation acceptance are manual; the 47-feature scope remains incomplete.') | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wsm-release-candidate
          path: |
            src/wsm-v2/dist/wsm-v6.1.0-rc2.zip
            src/wsm-v2/dist/wsm-v6.1.0-rc2.zip.sha256
            src/wsm-v2/dist/ci-build-provenance.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish verified private prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native-tests, android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: wsm-release-candidate
          path: src/wsm-v2/dist
      - name: Verify tag and release bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = v6.1.0-rc2
          python3 -B src/wsm-v2/scripts/package_release.py src/wsm-v2/dist/wsm-v6.1.0-rc2.zip
          (cd src/wsm-v2/dist && sha256sum --check wsm-v6.1.0-rc2.zip.sha256)
      - name: Publish RC2 assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" src/wsm-v2/dist/wsm-v6.1.0-rc2.zip src/wsm-v2/dist/wsm-v6.1.0-rc2.zip.sha256 src/wsm-v2/dist/ci-build-provenance.json
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
              --title 'WSM 6.1.0 RC2 — source-verified Android module' \
              --notes-file docs/releases/v6.1.0-rc2.md \
              src/wsm-v2/dist/wsm-v6.1.0-rc2.zip src/wsm-v2/dist/wsm-v6.1.0-rc2.zip.sha256 src/wsm-v2/dist/ci-build-provenance.json
          fi
