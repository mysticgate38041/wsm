name: WSM CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wsm-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  native-tests:
    name: Portable native contracts and package rejection tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Compile and execute host units through CMake
        shell: bash
        run: |
          set -euo pipefail
          cmake -S src/wsm-v2/jni -B src/wsm-v2/build/host-tests -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Release
          cmake --build src/wsm-v2/build/host-tests --parallel 2
          ctest --test-dir src/wsm-v2/build/host-tests --output-on-failure
      - name: Package rejection and source receipt units
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -X utf8 -m unittest discover -s src/wsm-v2/tests -p test_release.py -v

  android-build:
    name: Android ${{ matrix.backend }} dual ABI build and package checks
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        backend: [ndk-build, CMake]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned Android toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:ANDROID_HOME
          if (-not $sdk) { throw 'Runner Android SDK unavailable' }
          $manager = Join-Path $sdk 'cmdline-tools/latest/bin/sdkmanager.bat'
          & $manager '--install' 'platforms;android-34' 'build-tools;34.0.0' 'ndk;27.2.12479018' 'cmake;3.22.1'
          if ($LASTEXITCODE) { throw 'Android SDK installation failed' }
      - name: Validate catalog and generated snapshot
        shell: pwsh
        run: |
          python -B -X utf8 -m unittest discover -s src/wsm-v2/tests -p test_catalog.py -v
          if ($LASTEXITCODE) { throw 'Catalog tests failed' }
          python -B -X utf8 src/wsm-v2/scripts/build_feature_catalog.py --snapshot
          if ($LASTEXITCODE) { throw 'Catalog generation failed' }
          git diff --exit-code -- src/wsm-v2/features/feature_catalog.json src/wsm-v2/menu/FeatureCatalog.java src/wsm-v2/jni/wsm_feature_catalog.h
          if ($LASTEXITCODE) { throw 'Generated catalog differs from committed inputs' }
      - name: Build and verify module
        shell: pwsh
        run: |
          & ./src/wsm-v2/scripts/build.ps1 -Ndk "$env:ANDROID_HOME/ndk/27.2.12479018" -Jdk $env:JAVA_HOME -Sdk $env:ANDROID_HOME -Python (Get-Command python).Source -Jobs 2 -CatalogSnapshot -NativeBuild '${{ matrix.backend }}' -CMake "$env:ANDROID_HOME/cmake/3.22.1/bin/cmake.exe" -Ninja "$env:ANDROID_HOME/cmake/3.22.1/bin/ninja.exe"
      - name: Record CI build provenance
        shell: pwsh
        run: |
          $receipt = Get-Content -Raw src/wsm-v2/build/build-receipt.json | ConvertFrom-Json -AsHashtable
          $record = @{ commit=$env:GITHUB_SHA; ref=$env:GITHUB_REF; runId=$env:GITHUB_RUN_ID; runAttempt=$env:GITHUB_RUN_ATTEMPT; nativeBuildBackend='${{ matrix.backend }}'; qualification='INCOMPLETE_47_FEATURE_SCOPE'; dumpReaudited=$false; gameRuntimeExecuted=$false; androidFixturesExecuted=$false; ndk='27.2.12479018'; java=17; receipt=$receipt }
          $record | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 src/wsm-v2/dist/ci-build-provenance.json
          @('## WSM 6.2 RC1 build verified', '', '- Five ELF binaries, Java state tests, DEX and package rejection checks passed.', '- Twelve Android native fixtures compiled for both ABIs; their execution requires an Android device.', '- Portable native fixture execution is recorded in the native-tests job.', '- Original dump and game runtime remain unverified; the 47-feature scope remains incomplete.') | Add-Content $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wsm-release-candidate-${{ matrix.backend }}
          path: |
            src/wsm-v2/dist/wsm-v6.2.0-rc1.zip
            src/wsm-v2/dist/wsm-v6.2.0-rc1.zip.sha256
            src/wsm-v2/dist/ci-build-provenance.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish verified prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [native-tests, android-build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: wsm-release-candidate-ndk-build
          path: src/wsm-v2/dist
      - name: Verify tag and release bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = v6.2.0-rc1
          python3 -B src/wsm-v2/scripts/package_release.py src/wsm-v2/dist/wsm-v6.2.0-rc1.zip
          (cd src/wsm-v2/dist && sha256sum --check wsm-v6.2.0-rc1.zip.sha256)
          WSM_REQUIRE_RELEASE=1 python3 -B -X utf8 -m unittest discover -s src/wsm-v2/tests -p test_release.py
          python3 -B - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          dist = pathlib.Path('src/wsm-v2/dist')
          provenance = json.loads((dist / 'ci-build-provenance.json').read_text(encoding='utf-8-sig'))
          if (provenance['commit'] != os.environ['GITHUB_SHA'] or
                  provenance['ref'] != os.environ['GITHUB_REF'] or
                  provenance['runId'] != os.environ['GITHUB_RUN_ID'] or
                  provenance['nativeBuildBackend'] != 'ndk-build'):
              raise SystemExit('CI provenance does not match this tag, commit, run and backend')
          with zipfile.ZipFile(dist / 'wsm-v6.2.0-rc1.zip') as archive:
              release = json.loads(archive.read('release.json'))
              receipt = provenance['receipt']
              if receipt['sources'] != release['sources'] or receipt['build'] != release['build']:
                  raise SystemExit('CI receipt does not match packaged sources and build')
              for name, digest in receipt['binaries'].items():
                  if hashlib.sha256(archive.read(name)).hexdigest() != digest:
                      raise SystemExit('CI binary receipt mismatch: ' + name)
          print('Tag, commit, source and binary provenance: PASS')
          PY
      - name: Publish RC1 assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" src/wsm-v2/dist/wsm-v6.2.0-rc1.zip src/wsm-v2/dist/wsm-v6.2.0-rc1.zip.sha256 src/wsm-v2/dist/ci-build-provenance.json
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --prerelease \
              --title 'WSM 6.2.0 RC1 — modular Android build' \
              --notes-file docs/RELEASE_v6.2.0_rc1.md \
              src/wsm-v2/dist/wsm-v6.2.0-rc1.zip src/wsm-v2/dist/wsm-v6.2.0-rc1.zip.sha256 src/wsm-v2/dist/ci-build-provenance.json
          fi
